name: EclipseRPG
version: '${version}'
main: pe.kydium.eclipserpg.EclipseRPG
api-version: '1.21'
author: Kydium
description: Motor de historias RPG — escribe tu historia en un .txt y juégala con tus amigos

commands:
  nivel:
    description: Ver tu nivel y repartir puntos de habilidad
    aliases: [stats, habilidades]
  soles:
    description: Ver tus Soles
    aliases: [dinero, money]
  pagar:
    description: Pagar Soles a otro jugador
    usage: /pagar <jugador> <cantidad>
  guardian:
    description: Menú del Guardián (también con Shift + F o la tecla G)
    aliases: [menu, g]
  misiones:
    description: Diario de misiones de Crónicas del Eclipse
    aliases: [diario, quests]
  mision:
    description: Ver tu misión actual o elegir en una decisión
    usage: /mision [elegir <n>]
  historia:
    description: Crear, revisar y recargar historias (historia.txt)
    usage: /historia [recargar|errores|colocar|skins|lugares|lista|nueva|usar]
    permission: eclipserpg.admin
    aliases: [story, h]
  eclipse:
    description: Administración de EclipseRPG
    permission: eclipserpg.admin
    aliases: [erpg]

permissions:
  eclipserpg.admin:
    description: Comandos de administración (/eclipse)
    default: op

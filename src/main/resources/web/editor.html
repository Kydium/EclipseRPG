<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aventura Maker · Editor de historias</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23e0b354%22/%3E%3C/svg%3E">
<style>
:root{--bg:#14110f;--panel:#1d1915;--panel2:#25201b;--line:#3a3128;--line2:#4d4135;--text:#efe6d6;--muted:#a89a85;--dim:#7a6e5e;--gold:#e0b354;--gold2:#c8973a;--red:#e2645a;--green:#7cc36a;--blue:#6fb0e8;--purple:#b48ae6;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px}
.logo .sun{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffe39a,#e0b354 55%,#a8722a);box-shadow:0 0 0 3px #3a2c16}
.top .sp{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.pill.warn{color:#f3c96b;border-color:#6b5520}.pill.bad{color:#ff9a90;border-color:#6b2a24}.pill.good{color:#a6e39a;border-color:#2f5a26}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:7px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold2)}
.btn.pri{background:linear-gradient(#e7bd5f,#c8973a);border-color:#e7bd5f;color:#231a0c;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--line)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.main{display:grid;grid-template-columns:210px 1fr;min-height:0}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--r);display:flex;align-items:center;gap:10px;color:var(--muted)}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:#2f2619;color:var(--gold)}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--dim)}
.nav hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.nav .ic{width:18px;text-align:center}
.view{display:grid;grid-template-columns:300px 1fr;min-height:0}
.view.single{grid-template-columns:1fr}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#181410}
.list .head{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.list .head input{flex:1}
.list .items{overflow:auto;flex:1;padding:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.li:hover{background:var(--panel2)}
.li.on{background:#2f2619;border-color:#5a4520}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .num{font-size:11px;color:var(--dim);min-width:26px}
.li .err{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--gold2);padding:12px 10px 4px}
.form{overflow:auto;padding:22px 28px 60px;min-width:0}
.form h2{margin:0 0 4px;font-size:20px;font-weight:600}
.form .sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:14px;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .hint{color:var(--dim);font-weight:400;font-size:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.row:last-child{margin-bottom:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=url],input:not([type]),select,textarea{background:#120f0c;border:1px solid var(--line2);border-radius:var(--r);padding:7px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 3px #e0b35422}
textarea{resize:vertical;min-height:38px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--gold)}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:flex;gap:6px;align-items:flex-start}
.ln>*:first-child{flex:1}
.ln .btn{padding:6px 8px}
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:grid;gap:8px;align-items:end;background:#181410;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.empty{color:var(--dim);font-style:italic;padding:6px 0}
.skinbox{display:flex;gap:16px;align-items:center}
.skinbox canvas{background:#120f0c;border:1px solid var(--line2);border-radius:var(--r);image-rendering:pixelated}
.toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast div{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--gold);padding:10px 14px;border-radius:var(--r);max-width:420px;box-shadow:0 8px 24px #0008}
.toast .bad{border-left-color:var(--red)}.toast .good{border-left-color:var(--green)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(920px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;flex:1;font-size:16px}
.modal .mb{padding:16px 18px;overflow:auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gal .sk{background:#181410;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;cursor:pointer}
.gal .sk:hover{border-color:var(--gold2)}.gal .sk.on{border-color:var(--gold);background:#2f2619}
.gal .sk canvas{width:64px;height:128px;image-rendering:pixelated}
.gal .sk div{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.probs{display:flex;flex-direction:column;gap:6px}
.prob{display:flex;gap:10px;padding:9px 12px;border-radius:var(--r);background:#181410;border:1px solid var(--line);cursor:pointer}
.prob:hover{border-color:var(--line2)}
.prob .k{font-weight:600;min-width:52px}
.prob.e .k{color:var(--red)}.prob.w .k{color:#f3c96b}
.prob .where{color:var(--dim);font-size:12px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid #0006}
.kbd{font-family:ui-monospace,monospace;font-size:12px;background:#120f0c;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--gold)}
.preview{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);background:#120f0c;border:1px dashed var(--line2);border-radius:var(--r);padding:6px 10px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;color:var(--gold)}
.stat span{font-size:12px;color:var(--muted)}
.mm{display:inline-block;padding:2px 8px;border-radius:5px;background:#120f0c;border:1px solid var(--line)}
.chest{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;background:#2a2219;border:2px solid #4d4135;border-radius:10px;padding:10px;max-width:760px}
.slot{aspect-ratio:1;background:#120f0c;border:2px solid #3a3128;border-radius:6px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;overflow:hidden;min-width:0}
.slot:hover{border-color:var(--gold2)}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 3px #e0b35440}
.slot.buy{border-color:#3f7a2e;background:#16200f}.slot.sell{border-color:#8a6a1f;background:#221a0b}.slot.up{border-color:#6a3fa0;background:#1b1226}.slot.info{border-style:dashed;cursor:default;color:var(--dim)}
.slot .nm{font-size:10.5px;line-height:1.15;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.slot .pr{font-size:10.5px;color:var(--gold);margin-top:2px;white-space:nowrap}
.slot .qt{position:absolute;top:2px;right:4px;font-size:10px;color:var(--muted)}
.slot .tg{position:absolute;top:2px;left:4px;font-size:9px;font-weight:700}
.slot.buy .tg{color:#8fd05a}.slot.sell .tg{color:#e7bd5f}.slot.up .tg{color:#c9a0ff}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.catcard{background:#14110d;border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:4px}
.catcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#18161e;margin-bottom:4px}
.catcard span{color:var(--muted);font-size:13px}
.gensel{display:flex;gap:14px;align-items:flex-start}.gensel img{width:220px;border-radius:8px;border:1px solid var(--line);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);background:#120f0c}
.chip:hover{border-color:var(--gold2)}.chip.on{background:#2f2619;border-color:var(--gold);color:var(--gold)}
.cond .cl{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;margin-bottom:8px}.cond .cl>span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);background:var(--panel);overflow:auto;flex:none}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px 8px 0 0;color:var(--muted);border:1px solid transparent;border-bottom:0;white-space:nowrap}
.tabs button.on{color:var(--gold);background:var(--bg);border-color:var(--line)}.tabs .cnt{font-size:11px;color:var(--dim)}
.wv{display:flex;flex-direction:column;min-height:0;height:100%}.wv>.view{flex:1;min-height:0}
.sum{background:#1a1712;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;color:var(--muted)}.sum b{color:var(--text)}
.daybar{display:flex;border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);font-size:12px}.daybar div{padding:10px 12px;white-space:nowrap}.daybar .d{background:linear-gradient(90deg,#e0b354,#f1d58a);color:#3a2a08}.daybar .n{background:linear-gradient(90deg,#1c2340,#0f1226);color:#b9c4f0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.roles>div{background:#181410;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}.roles span{color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:7px 14px;color:var(--muted)}
.seg button.on{background:#2f2619;color:var(--gold)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{background:#100010f0;border:2px solid #2d0a63;outline:2px solid #100010;border-radius:4px;padding:8px 10px;font-family:"Minecraftia","Courier New",ui-monospace,monospace;font-size:14px;line-height:1.45;color:#fff;max-width:420px;text-shadow:2px 2px 0 #00000088;min-height:40px}
.tip div{min-height:1.45em;white-space:pre-wrap;word-break:break-word}
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px}
.tb .sw{width:20px;height:20px;border-radius:4px;border:1px solid #0008;cursor:pointer}
.tb .sw:hover{outline:2px solid var(--gold)}
.tb .btn{padding:3px 8px;font-size:12px}
.tb .sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.tb input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line2);border-radius:4px;background:none}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,420px);gap:18px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.lock{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;text-align:center;padding:20px}
@media (max-width:900px){.main{grid-template-columns:1fr}.nav{flex-direction:row;overflow:auto}.nav hr,.nav .cnt{display:none}.view{grid-template-columns:1fr}.list{max-height:240px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// =====================================================================
//  Editor visual de historias — Aventura Maker
//  Lee y escribe historia.txt y los archivos avanzados a través del servidor.
// =====================================================================
const TOKEN = new URLSearchParams(location.search).get("t") || localStorage.getItem("erpg_token") || "";
if (TOKEN) localStorage.setItem("erpg_token", TOKEN);

const COLORS = {verde:"#55ff55","verde oscuro":"#00aa00",rojo:"#ff5555","rojo oscuro":"#aa0000",azul:"#5555ff","azul oscuro":"#0000aa",celeste:"#55ffff",turquesa:"#00aaaa",amarillo:"#ffff55",dorado:"#ffaa00",morado:"#aa00aa",rosa:"#ff55ff",blanco:"#ffffff",gris:"#aaaaaa","gris oscuro":"#555555",negro:"#222222"};
const MM_COLORS = {green:"verde",dark_green:"verde oscuro",red:"rojo",dark_red:"rojo oscuro",blue:"azul",dark_blue:"azul oscuro",aqua:"celeste",dark_aqua:"turquesa",yellow:"amarillo",gold:"dorado",dark_purple:"morado",light_purple:"rosa",white:"blanco",gray:"gris",dark_gray:"gris oscuro",black:"negro"};
const ES_TO_MM = Object.fromEntries(Object.entries(MM_COLORS).map(([a,b])=>[b,a]));
const OBJ_TYPES = [
  ["matar","Matar enemigos","mata"],["derrotar","Derrotar a un jefe","derrota a"],["minar","Minar o talar","mina"],
  ["tener","Tener en el inventario","ten"],["entregar","Entregar al NPC","entrega"],["fundir","Fundir en horno","funde"],
  ["pescar","Pescar","pesca"],["domesticar","Domesticar","domestica"],["encantar","Encantar","encanta"],
  ["ir","Ir a una dimensión","ve al"],["hablar","Hablar con un NPC","habla con"],["mazmorra","Explorar una mazmorra","explora la mazmorra"],["estructura","Encontrar una estructura","encuentra la estructura"]];
const VERB = {};
[["matar","matar mata mate elimina eliminar caza cazar acaba acabar asesina"],["derrotar","derrota derrotar derrote vence vencer venza"],
 ["minar","minar mina mine picar pica romper rompe talar tala tale cavar cava cosechar cosecha recolectar recolecta extraer extrae"],
 ["tener","tener ten tenga conseguir consigue consiga reunir reune junta juntar obtener obten obtenga craftear craftea fabricar fabrica crear crea forjar forja construir construye"],
 ["entregar","entregar entrega entregue traer trae traiga llevar lleva lleve dar da"],["fundir","fundir funde funda cocinar cocina cocine hornear hornea asar asa"],
 ["pescar","pescar pesca pesque"],["domesticar","domesticar domestica domar doma adoptar adopta"],["encantar","encantar encanta encante"],
 ["ir","entrar entra entre ir ve vaya viajar viaja visitar visita llegar llega cruzar cruza"],["hablar","hablar habla hable conversar conversa"],
 ["mazmorra","encontrar encuentra encuentre explorar explora descubrir descubre completa completar mazmorra"]].forEach(([t,w])=>w.split(" ").forEach(v=>VERB[v]=t));
const NUMS = {un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,cien:100};
const ABILITIES = {ONDA:"Onda de choque",SALTO:"Salto aplastante",TELEPORTE:"Teletransporte",INVOCAR:"Invocar esbirros",FLECHAS:"Lluvia de flechas",FUEGO:"Bolas de fuego",RAYO:"Rayo",ATRAER:"Atraer jugadores",EFECTO:"Aplicar efecto"};
const BARS = ["RED","PURPLE","BLUE","GREEN","YELLOW","PINK","WHITE"];
const SLOTS = {mano:"Mano",mano2:"Otra mano",casco:"Casco",pecho:"Pecho",piernas:"Piernas",pies:"Pies"};

// ------------------------------------------------------------------ estado
const st = {cat:null, story:null, yaml:{}, yamlDirty:{}, txtDirty:false, view:"inicio", sel:{}, filter:{}, probs:[], ranges:null, busy:false};

// ------------------------------------------------------------------ utilidades
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==="class") e.className=v; else if (k==="style") e.style.cssText=v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k==="value") e.value=v; else if (k==="checked") e.checked=!!v;
    else e.setAttribute(k, v===true?"":v);
  }
  for (const k of kids.flat(9)) if (k!=null && k!==false) e.append(k.nodeType?k:document.createTextNode(String(k)));
  return e;
}
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ñ/g,"n").replace(/[^a-z0-9_*: -]/g," ").replace(/\s+/g," ").trim()}
function slug(s){return norm(s).replace(/ /g,"_").replace(/[^a-z0-9_]/g,"")}
function toast(msg, kind){const d=h("div",{class:kind||""},msg);$("#toast").append(d);setTimeout(()=>d.remove(), kind==="bad"?7000:3500)}
function num(w){if(/^\d{1,6}$/.test(w))return +w;return NUMS[w]}
function cap(s){s=(s||"").trim();return s?s[0].toUpperCase()+s.slice(1):s}
async function api(path, opt={}){
  const r = await fetch("/api/"+path, {...opt, headers:{"X-Token":TOKEN, ...(opt.headers||{})}});
  let j=null; try{ j = await r.json(); }catch(e){}
  if (!r.ok) throw new Error((j&&j.mensaje)||("Error "+r.status));
  return j;
}
function markTxt(){ st.txtDirty=true; scheduleCheck(); updateTop(); }
function markYaml(n){ st.yamlDirty[n]=true; updateTop(); }
let checkTimer=null;
function scheduleCheck(){ clearTimeout(checkTimer); checkTimer=setTimeout(check, 1200); }

// ------------------------------------------------------------------ historia.txt  <->  modelo
function parseStory(text){
  const S={title:"",desc:"",village:"",currency:"",acts:[],npcs:[],missions:[],head:[]};
  let npc=null, m=null, act=1;
  const lines=text.replace(/\r/g,"").split("\n");
  for (let raw of lines){
    const t=raw.trim(); if(!t||t.startsWith("#")||t.startsWith("//")) continue;
    const head=norm(t).replace(/:/g," ").replace(/\s+/g," ");
    const after=()=>{const i=t.indexOf(":");return i<0?"":t.slice(i+1).trim()};
    if (/^historia /.test(head)&&t.includes(":")){S.title=after();npc=m=null;continue}
    if (head.startsWith("descripcion")&&t.includes(":")){S.desc=after();continue}
    if (head.startsWith("aldea")&&t.includes(":")){S.village=after();continue}
    if (head.startsWith("moneda")&&t.includes(":")){S.currency=after();continue}
    if (/^acto /.test(head)){const r=t.slice(4).trim();const i=r.indexOf(":");act=parseInt(i<0?r:r.slice(0,i))||act;S.acts.push({n:act,name:i<0?"":r.slice(i+1).trim()});npc=m=null;continue}
    if (/^npc /.test(head)&&!/^\s/.test(raw)){const r=t.slice(4).trim();const i=r.indexOf(":");npc={id:slug(i<0?r:r.slice(0,i)),nombre:i<0?cap(r):r.slice(i+1).trim(),color:"blanco",skin:"",oficio:"",lugar:"",objeto:"",otra:"",servicios:[],charla:[],otros:[]};S.npcs.push(npc);m=null;continue}

function parseRewards(text){
  const out={xp:"",money:"",items:[]};
  for(const part of (text||"").split(",")){
    const p=part.trim(); if(!p) continue;
    const w=norm(p).split(" "); let n=null; if(num(w[0])!=null)n=num(w.shift());
    else if(w.length>1&&num(w[w.length-1])!=null&&w[0]!=="libro")n=num(w.pop());
    const rest=w.join(" "); const cur=norm(st.story&&st.story.currency||"monedas");
    if(["xp","experiencia","exp"].includes(rest)){out.xp=n||0;continue}
    if([cur,"monedas","moneda","soles","sol"].includes(rest)||(cur.endsWith("s")&&rest===cur.slice(0,-1))){out.money=n||0;continue}
    if(rest.startsWith("objeto ")||rest.startsWith("especial ")){out.items.push({tipo:"especial",cant:n||1,cosa:rest.slice(rest.indexOf(" ")+1).replace(/ /g,"_")});continue}
    if(rest.startsWith("pocion")){out.items.push({tipo:"pocion",cant:n||1,cosa:rest.replace(/^pocion(es)?( de)?/,"").trim()});continue}
    if(rest.startsWith("libro ")){const ws=rest.slice(6).split(" ");let lvl=1;if(ws.length>1&&num(ws[ws.length-1])!=null)lvl=num(ws.pop());out.items.push({tipo:"libro",cant:1,cosa:ws.join(" "),nivel:lvl});continue}
    out.items.push({tipo:"objeto",cant:n||1,cosa:rest});
  }
  return out;
}
function rewardsText(r, allowMoney){
  const p=[]; if(allowMoney){ if(+r.xp)p.push(r.xp+" xp"); if(+r.money)p.push(r.money+" "+(st.story.currency||"monedas")); }
  for(const it of r.items){ if(!it.cosa)continue;
    if(it.tipo==="especial")p.push((+it.cant>1?it.cant+" ":"")+"objeto "+it.cosa);
    else if(it.tipo==="pocion")p.push(+it.cant>1?it.cant+" pociones de "+it.cosa:"poción de "+it.cosa);
    else if(it.tipo==="libro")p.push("libro "+it.cosa+" "+(it.nivel||1));
    else p.push((it.cant||1)+" "+it.cosa);
  }
  return p.join(", ");
}

function drawSkin(cv, name, mode){

    if(!img){x.fillStyle="#2a221b";x.fillRect(0,0,cv.width,cv.height);x.fillStyle="#7a6e5e";x.font="11px sans-serif";x.textAlign="center";x.fillText("sin skin",cv.width/2,cv.height/2);return}

    d(8,8,8,8,4,0);d(40,8,8,8,4,0);d(20,20,8,12,4,8);d(20,36,8,12,4,8);
    d(44,20,aw,12,4-aw,8);d(44,36,aw,12,4-aw,8);d(36,52,aw,12,12,8);d(52,52,aw,12,12,8);
    d(4,20,4,12,4,20);d(4,36,4,12,4,20);d(20,52,4,12,8,20);d(4,52,4,12,8,20);

}

// Traductor: primero junta los nombres, luego pregunta al servidor una sola vez
function makeResolver(known,tr,W){

  const isCustomItem=id=>known.objetos.has(id)||!!(st.cat.objetosPropios||{})[id];

    eff(p,b,f){const n=norm(p).replace(/^minecraft:/,"");const raw=n.replace(/ /g,"_");if((st.cat.efectos||[]).includes(raw))return raw;if(EFFECT_ES[n])return EFFECT_ES[n];if(POTION_EFFECT[raw])return POTION_EFFECT[raw];const t=look("pociones",p);if(t){const e=t.replace(/^(strong|long)_/,"");return POTION_EFFECT[e]||e}miss(b,f,"el efecto",p);return raw},
    ench(p,b,f){const raw=norm(p).replace(/ /g,"_");const t=look("encantamientos",p);if(t)return t;if(tr&&!/^[a-z_]+$/.test(raw))miss(b,f,"el encantamiento",p);return raw},
    mob(p,b,f){const raw=norm(p).replace(/ /g,"_");if((st.cat.entidades||[]).includes(raw))return raw;const t=look("mobs",p);if(t)return t;miss(b,f,"la criatura",p);return raw},
    mobOrCustom(p,b,f){const id=slug(p);if(isCustomMob(id))return id;return R.mob(p,b,f)},
    // forShopless=true: devuelve "custom:id" o el material en mayúsculas (equipo, botín de enemigos)

      m=n.match(/^(?:minecraft:)?potion (?:of )?(.+)$/)||n.match(/^(.+) potion$/);if(m)return "pocion:"+(look("pociones",m[1])||m[1].replace(/ /g,"_"));
      m=n.match(/^pocion arrojadiza (?:de )?(.+)$/);if(m)return "pocion-arrojadiza:"+(look("pociones",m[1])||m[1].replace(/ /g,"_"));
      m=n.match(/^pocion (?:de )?(.+)$/);if(m)return "pocion:"+(look("pociones",m[1])||m[1].replace(/ /g,"_"));
      const mat=R.mat(s,b,f);return plain?mat.toUpperCase():"material:"+mat.toUpperCase()},
    lootLine(x,b,f){const p=String(x).trim().split(/\s+/);const nums=[];while(p.length&&nb(p[p.length-1])!=null)nums.unshift(p.pop());let it=R.item(p.join(" "),b,f,true);if(it.startsWith("custom:")||it.includes(":"))it=it;return it+" "+(nums[0]||1)+" "+(nums[1]??1)}};
  return R;

async function importBlocks(blocks){

async function check(show){
  try{const txt=serialize(st.story);const r=await api("revisar",{method:"POST",body:JSON.stringify({texto:txt,extra:unsavedCatalog(null)})});
    st.probs=r.problemas.map(p=>({...p,where:whereIs(p.linea)}));
    updateTop(); if(st.view==="revisar"||show){ if(show&&st.view!=="revisar"&&r.errores) toast(r.errores+" error(es). Mira «Revisar y aplicar».","bad"); else if(show&&!r.errores) toast("Sin errores"+(r.problemas.length?" ("+r.problemas.length+" avisos)":""),"good"); }
    if(st.view==="revisar") renderView();
  }catch(e){if(show)toast(e.message,"bad")}
}
async function save(apply){
  if(st.busy) return; st.busy=true;
  try{
    for(const n of ["mobs","objetos","tiendas","mundo","estructuras","mazmorras"]) if(st.yamlDirty[n]){await api("yaml?archivo="+n,{method:"PUT",body:JSON.stringify(st.yaml[n])});st.yamlDirty[n]=false}
    const txt=serialize(st.story);
    if(st.txtDirty||apply){await api("texto",{method:"PUT",body:txt});st.txtDirty=false}
    if(apply){const r=await api("aplicar",{method:"POST"});st.probs=r.problemas.map(p=>({...p,where:whereIs(p.linea)}));
      if(r.aplicado) toast("✔ Aplicado en el juego: "+r.misiones+" misiones, "+r.npcs+" personajes","good");
      else {toast("Guardado, pero tiene "+r.errores+" error(es): el juego sigue con la versión anterior","bad");st.view="revisar"}
      st.cat=await api("catalogo");
    } else toast("Guardado","good");
    render();
  }catch(e){toast(e.message,"bad")}finally{st.busy=false}
}
async function loadAll(){
  st.cat=await api("catalogo");
  const t=await api("texto"); st.story=parseStory(t.texto);
  if(!st.story.currency) st.story.currency=st.cat.moneda||"";
  for(const n of ["mobs","objetos","tiendas","mundo","estructuras","mazmorras"]){const y=await api("yaml?archivo="+n);st.yaml[n]=y.datos||{}}
  st.txtDirty=false; st.yamlDirty={}; serialize(st.story); render(); check(false);
}

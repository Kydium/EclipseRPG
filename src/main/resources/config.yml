# =========================================================
#  Aventura Maker — crea tus propias historias RPG
#  Las historias están en plugins/AventuraMaker/historias/<nombre>/historia.txt
#  Guía: plugins/AventuraMaker/GUIA.txt   ·   Comando: /historia
# =========================================================

historia: eclipse               # carpeta de la historia que se juega (cámbiala con /historia usar)

zona-horaria: America/Lima      # para contratos diarios y mercado oscuro
autoguardado-minutos: 5

niveles:
  nivel-maximo: 0               # 0 = sin límite de nivel (pon un número si quieres un tope)
  xp-por-nivel: 150             # XP para pasar del nivel N al N+1 = 150 x N
  puntos-por-nivel: 1
  niveles-por-tier: 5           # niveles 1-5 = tier 1 (Acto 1), 6-10 = tier 2...
  mostrar-en-tab: true          # muestra [nivel] en la lista de jugadores

stats:                          # atributos al estilo Elden Ring (se reparten en /nivel)
  costo-reinicio: 500
  vida:                         # ❤ Vigor
    por-punto: 1.0              # vida máxima por punto
    maximo: 30
  mente:                        # 👁 Mente
    por-punto: 2.0              # % más de probabilidad de los poderes de armas
    recarga: 1.5                # % menos de recarga de poderes (máx. 50 %)
    maximo: 20
  defensa:                      # 🛡 Aguante
    por-punto: 0.5              # armadura por punto
    empuje: 2                   # % de firmeza (menos empuje)
    hambre: 3                   # % de no gastar hambre (máx. 60 %)
    maximo: 20
  fuerza:                       # ⚔ Fuerza
    por-punto: 0.5              # daño por punto
    pesadas: 1.5                # % de daño extra con hachas y mazas
    maximo: 20
  agilidad:                     # ➶ Destreza
    por-punto: 1.0              # % de velocidad al moverse
    ataque: 1.5                 # % de velocidad de ataque
    distancia: 2                # % de daño con arcos, ballestas y tridentes
    maximo: 15
  inteligencia:                 # ✦ Inteligencia
    por-punto: 4.0              # % de daño de poderes mágicos (rayo, cadena, sangrado, perforar)
    maximo: 20
  fe:                           # ☀ Fe
    por-punto: 3.0              # % de curación
    corrompidos: 2              # % de daño contra Corrompidos
    maximo: 20
  fortuna:                      # 💎 Arcano
    por-punto: 3.0              # % de Soles y botín
    suerte: 0.1                 # suerte (mejor pesca y cofres)
    maximo: 15

# Algunos mobs hostiles que aparecen solos se vuelven Corrompidos
# con el tier del jugador más cercano.
corrupcion:
  probabilidad: 0.12
  radio-jugador: 64
  prob-fragmento: 0.01          # probabilidad de soltar un Fragmento de Mejora (+0.3 % por tier)
  recompensas:                  # premio por matar Corrompidos
    multiplicador-soles: 2.0    # soles del tier × esto
    multiplicador-xp: 1.5
    prob-esencia: 0.35          # Esencia Corrupta (+3 % por tier); Pip la compra
    prob-corazon: 0.03          # Corazón Corrupto, raro (+0.5 % por tier, +35 % élites); Sabina lo cambia
    corazones-jefe: 2           # corazones que da cada jefe a cada jugador
    racha-segundos: 12          # matar otro antes de esto sigue la racha
    racha-por-muerte: 10        # +10 % de soles por cada muerte de la racha (desde la 3.ª)
    racha-maxima: 100
    texto-flotante: true        # "+12 ☀" que sube donde cae
  tiers:                        # vida total, daño extra, XP y Soles al matarlo
    - {vida: 40,  danio: 3,  xp: 10, soles: 2}
    - {vida: 60,  danio: 4,  xp: 14, soles: 4}
    - {vida: 80,  danio: 5,  xp: 18, soles: 6}
    - {vida: 100, danio: 7,  xp: 22, soles: 8}
    - {vida: 120, danio: 8,  xp: 26, soles: 10}
    - {vida: 150, danio: 10, xp: 30, soles: 12}
    - {vida: 180, danio: 11, xp: 34, soles: 14}
    - {vida: 210, danio: 13, xp: 38, soles: 16}
    - {vida: 250, danio: 15, xp: 42, soles: 18}
    - {vida: 300, danio: 18, xp: 46, soles: 20}
  nombres:
    ZOMBIE: Zombi
    HUSK: Husk
    DROWNED: Ahogado
    ZOMBIE_VILLAGER: Aldeano zombi
    SKELETON: Esqueleto
    STRAY: Esqueleto glacial
    BOGGED: Bogged
    SPIDER: Araña
    CAVE_SPIDER: Araña de cueva
    CREEPER: Creeper
    ENDERMAN: Enderman
    WITCH: Bruja
    SLIME: Slime
    PHANTOM: Phantom
    BLAZE: Blaze
    GHAST: Ghast
    MAGMA_CUBE: Cubo de magma
    WITHER_SKELETON: Esqueleto wither
    PIGLIN_BRUTE: Piglin bruto
    HOGLIN: Hoglin
    ZOGLIN: Zoglin
    PILLAGER: Saqueador
    VINDICATOR: Vindicador
    EVOKER: Evocador
    GUARDIAN: Guardián
    SILVERFISH: Lepisma
    ENDERMITE: Endermite
    SHULKER: Shulker
    BREEZE: Breeze

# Multiplicadores generales de dificultad (1.0 = como está en mobs.yml)
dificultad:
  vida-jefes: 1.0
  danio-jefes: 1.0
  vida-corrompidos: 1.0
  danio-corrompidos: 1.0
  vida-extra-por-jugador: 0.5   # cada jugador extra cerca del jefe le da +50% de vida
  jefes:
    tope-por-golpe: 0.05        # ningún golpe le quita más de este % de su vida (0.05 = 5 %)
    desviar-flechas: 0.3        # probabilidad de desviar una flecha

atajos:
  tecla-g: true                 # la tecla "Acciones rápidas" (G) abre el menú (instala un paquete de datos)

dialogos:
  ventana: true                 # true = ventanas de diálogo · false = diálogos por el chat

jefes:
  soles-si-repite: 200          # si un jugador ya tiene el premio único del jefe

mejoras:                        # yunque de Bruno: armas, armaduras y herramientas
  niveles: 10                   # +1 a +5 con Fragmento de Mejora, +6 a +8 con Superior, +9 y +10 con Ancestral
  probabilidad-superior: 0.8    # éxito de +6 a +8 (si falla se pierde el fragmento, no el objeto)
  probabilidad-ancestral: 0.6   # éxito de +9 y +10

tiendas:
  compran-todo: [general]       # tiendas con la pestaña "Vender lo que sea"
  novedades:                    # cosas únicas al azar que cambian cada día (tipo:cantidad)
    general: [armaduras:5, curiosidades:3]     # Pip
    herreria: [armas:4, herramientas:2]        # Bruno
    alquimia: [pociones:4, libros:2]           # Fray Odón
    trueque: [reliquias:2]                     # Sabina (se pagan con Corazones Corruptos)
  venta-general:
    multiplicador: 1.0          # cuánto se paga en "Vender lo que sea" (1.0 = normal)

grieta:
  costo-por-tier: 50            # Soles para abrirla (x tier)
  oleadas: 5
  mobs-base: 3                  # enemigos = base + 2 x oleada + 2 x (jugadores - 1)
  radio-grupo: 15               # amigos a esta distancia entran contigo
  tiempo-maximo-minutos: 10
  vida-guardian: 4.0            # el Guardián de la última oleada tiene x4 de vida
  xp-por-tier: 300
  soles-por-tier: 60
  prob-fragmento: 0.25
  mobs-por-tier:
    1: [zombi_corrompido, arana_corrompida]
    2: [esqueleto_corrompido, creeper_corrompido, zombi_corrompido]
    3: [vindicador_corrompido, saqueador_corrompido]
    4: [ahogado_corrompido, vindicador_corrompido]
    5: [husk_corrompido, bruja_corrompida]
    6: [esqueleto_wither_corrompido, blaze_corrompido]
    7: [bogged_corrompido, breeze_corrompido]
    8: [sombra_corrompida, esqueleto_wither_corrompido]
    9: [piglin_bruto_corrompido, hoglin_corrompido]
    10: [enderman_corrompido, piglin_bruto_corrompido, sombra_corrompida]

aldea:
  indestructible: true          # nadie rompe ni construye en la aldea (los admins en creativo sí)
  margen-proteccion: 6          # bloques extra alrededor del borde de la aldea
  auto: true                    # construir la aldea sola al iniciar un mundo nuevo
  tipo: auto                    # auto (al azar) | chica | mediana | grande | clasica (el plano fijo de antes)
  trazado: auto                 # auto | radial | cuadricula | lineal | anillo | ramificado (forma de las calles)
  estilo: auto                  # auto (según el bioma) | llanura | taiga | nieve | desierto | sabana | cerezo | pantano | selva | oscuro
  ubicacion: spawn              # spawn = donde aparecen los jugadores · buscar = busca un bioma bonito (puede quedar lejos)
  radio-spawn: 160              # si en el spawn hay agua o montaña, se aparta como mucho esto
  mover-spawn: true             # los jugadores aparecen en la plaza de la aldea
  biomas: [plains, sunflower_plains, meadow, forest, flower_forest, birch_forest, old_growth_birch_forest, cherry_grove, savanna]
  busqueda-max: 1500            # (modo buscar) distancia máxima desde el spawn
  desnivel-max: 7               # diferencia de altura aceptada en el terreno
  bloques-por-tick: 8000
  aldeanos-invencibles: true    # que no los maten los Corrompidos
  # generada, centro y puestos se llenan solos

# Se guarda con /eclipse setcampamento (destino del Pergamino del Campamento)
campamento: {}

# Paquete de recursos con las skins de los NPCs: el propio servidor lo arma y lo sirve.
# Si tus amigos no pueden descargarlo, revisa que el puerto no esté bloqueado.
paquete-recursos:
  activo: true
  obligatorio: false            # true = quien lo rechace no puede entrar
  puerto: 25580
  monstruos-corrompidos: true   # venas moradas en zombis, esqueletos, arañas, creepers, brujas… y grietas moradas en los gólems
  direccion: ""                 # vacío = la misma dirección con la que se conectan

# Paseo de los NPCs (bloques alrededor de su puesto)
npc-paseo:
  radio-historia: 3.5
  radio-relleno: 13

# Al borrar la carpeta "world" el plugin lo detecta: rehace la aldea, NPCs, mazmorras y ruinas.
# Si esto es true, también reinicia el nivel y misiones de todos los jugadores.
reiniciar-progreso-con-mundo-nuevo: true

# Editor visual de historias (se abre en el navegador con /historia editor)
editor:
  activo: true
  token: ""                     # se genera solo; es la "contraseña" del link del editor

# Mundo vivo (reglas, apariciones y eventos se editan en historias/<id>/avanzado/mundo.yml o en el editor web)
mundo:
  maximo-enemigos-cerca: 30     # tope de monstruos cerca de un jugador para las oleadas y los multiplicadores

# Estructuras propias (se definen en historias/<id>/avanzado/estructuras.yml o en el editor web)
estructuras:
  bloques-por-tick: 6000        # velocidad de construcción
  # Dificultad: cuanto más lejos del spawn, más peligroso (1 a 7 ☠). "peligro: N" en estructuras.yml lo fija.
  dificultad:
    bloques-por-nivel: 450      # cada 450 bloques desde el spawn sube un nivel de peligro
    enemigos-por-nivel: 0.35    # +35 % de enemigos por nivel de peligro
    enemigos-por-jugador: 0.5   # +50 % por cada jugador extra dentro
    vida-por-nivel: 0.2         # +20 % de vida (enemigos de la historia) por nivel
    vida-jefe-por-nivel: 0.3    # +30 % de vida del jefe por nivel
    elite-base: 0.06            # probabilidad de élite (★: doble vida, fuerza, resistencia y velocidad)
    elite-por-nivel: 0.04       #   +4 % por nivel de peligro
    refuerzos-desde: 3          # desde este peligro, al caer la mayoría llega una segunda tanda

# Poderes de armas (robo de vida, rayo…) y runas que se forjan en cualquier arma o armadura
poderes:
  max-runas: 5                  # runas distintas por objeto (+1 hueco al llegar a +5 y otro a +10)
  forjar-en-yunque: true        # las runas se forjan haciendo clic en un yunque (false = en cualquier parte)
  niveles-base: 5               # niveles de experiencia que cuesta forjar una runa
  niveles-por-runa: 3           # niveles extra por cada runa que el objeto ya tenga

# Lo que ve el jugador en pantalla
viajes:                         # piedras de viaje: una en la aldea y una en cada ciudad
  activo: true
  costo-por-100-bloques: 3      # Soles que cuesta viajar por cada 100 bloques
  costo-minimo: 5
  segundos-quieto: 3            # hay que quedarse quieto (sin recibir daño) estos segundos
  espera-segundos: 20           # tiempo entre un viaje y otro

hud:
  vida-monstruos: true          # al golpear un monstruo, su vida sale junto a su nombre ("❤ 14/20")
  vida-monstruos-segundos: 6    # cuánto se ve después del último golpe
  vida-sobre-la-cabeza: true    # muestra "18/24 ❤" debajo del nombre de cada jugador
  panel:                        # cuadro de la misión a la izquierda (usa el paquete de recursos)
    activo: true
    escala: 2                   # Tamaño de interfaz de Minecraft para el que se acomoda (media altura, a la izquierda); cada jugador lo cambia con /g panel escala <n>
  monedas: true                 # dinero abajo a la derecha, junto a la barra rápida (necesita el paquete de recursos)
  desplazamiento: 100           # cuántos píxeles a la derecha del centro (100 = justo al lado de la barra)
  localizador: true             # puntos en la barra de localización (donde está la experiencia) hacia la misión
  localizador-aldea: true       # otro punto hacia la aldea cuando estás lejos
  color-mision: gold            # color del punto (nombre de color de Minecraft o #rrggbb)
  color-aldea: green


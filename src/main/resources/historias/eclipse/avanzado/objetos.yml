    mejorable: true
    efecto-en-mano: night_vision
    encantamientos: {sharpness: 2}
    atributos:
      - {atributo: attack_damage, valor: 8, slot: mainhand}     # 5 normal + 3
      - {atributo: attack_speed, valor: -2.4, slot: mainhand}


# =========================================================
#  ESTRUCTURAS PROPIAS — es más cómodo desde el editor web (Estructuras).
#
#  Crear una nueva dentro del juego:
#    1. Constrúyela en creativo.
#    2. Mira una esquina de abajo: /estructura pos1 · mira la contraria de arriba: /estructura pos2
#    3. /estructura guardar torre_mago      (queda en la carpeta estructuras/ de la historia)
#  Carteles especiales (1ª línea): [enemigo] [jefe] [entrada] [npc] (en [npc], su id en la 2ª línea)
#
#  aparece: azar (sola, en terreno nuevo) | mision (al aceptar una misión con "estructura: id") | manual
#  probabilidad: por cada chunk nuevo · maximo: cuántas puede haber en el mundo
#  distancia-min / distancia-max: desde la aldea (en "azar", distancia-min es desde el spawn)
#  biomas: ids o grupos (frio, calido, desierto, selva, oceano, montana, pantano, bosque) · vacío = cualquiera
#  hundir: -3 la entierra 3 bloques · desnivel-max: qué tan plano debe ser el terreno
#  enemigos: aparecen cuando entra un jugador · reaparicion: minutos (0 = solo la primera vez)
#  botin: "objeto cantidad probabilidad" para los cofres y barriles · botin-tiradas: veces que se sortea
#  En una misión:   estructura: torre_vigia      objetivo: encuentra la estructura torre_vigia
#
#  GENERADAS: en vez de "plano" pon "generador: <tipo>" y cada vez sale distinta, adaptada al terreno.
#  Tipos: /estructura catalogo  (aldeas, torres, molinos, faros, ruinas, templos, fortalezas, bases…)
#  estilo: auto (según el bioma) | llanura | taiga | nieve | desierto | sabana | cerezo | pantano | selva | oscuro
# =========================================================

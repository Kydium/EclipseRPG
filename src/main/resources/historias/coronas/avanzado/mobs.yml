# =========================================================
#  Las Siete Coronas: Corrompidos (del Eclipse) + Velados y jefes de las coronas
#  Aparecen con: /eclipse spawn <id> <jugador> [cantidad]
#  vida: vida total (20 = zombi normal)
#  danio-extra: se suma al daño normal del mob · danio: reemplaza el daño base
#  velocidad: 0.2 = +20% · escala: tamaño (1.0 normal)
#  equipo: mano, mano2, casco, pecho, piernas, pies (material o custom:id)
#  premios: se entregan a cada jugador cerca del jefe. una-vez: solo la primera vez
#  esbirros: al bajar a la mitad de vida invoca "cantidad-esbirros" refuerzos
#  armadura / dureza / resistencia-empuje (0 a 1): defensa del mob
#  furia: al 30% de vida gana Fuerza II y Velocidad, y usa habilidades el doble de rápido
#  aura: partícula alrededor del jefe (FLAME, SMOKE, PORTAL, WITCH, SOUL_FIRE_FLAME...)
#  habilidades: tipo ONDA | SALTO | TELEPORTE | INVOCAR | FLECHAS | FUEGO | RAYO | ATRAER | EFECTO
#             | EMBESTIDA | CLONES | METEOROS | ESCUDO (invulnerable mientras vivan sus esbirros) | CADENAS
#  Los jefes: no les afectan pociones, fuego, lava ni poderes de armas; ningún golpe les quita más del 5 %.
#    cada: segundos · potencia: daño (en EFECTO, nivel del efecto) · radio: bloques
#    extra: mobs para INVOCAR o efecto para EFECTO · cantidad: mobs / flechas / segundos del efecto
#  La vida de los jefes sube +50% por cada jugador extra cerca (config.yml > dificultad).
# =========================================================

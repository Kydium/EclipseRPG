    luz: soul_lantern
    decoracion: [cobweb, skeleton_skull, bone_block]
    escalera: cobblestone_stairs
    losa: cobblestone_slab
    muro: cobblestone_wall
    peligro: lava
    luz-tenue: soul_lantern
    sangre: redstone_block

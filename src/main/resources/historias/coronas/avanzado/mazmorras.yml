# =========================================================
#  Mazmorras de Las Siete Coronas (una por acto) y ruinas al azar.
#  La mazmorra de un acto se construye la primera vez que alguien acepta
#  la misión del jefe de ese acto, a cierta distancia del campamento.
#  Bloques: ids de Minecraft. botin: "spec cantidad probabilidad(0-1)"
#  escalera/losa/muro: bloques de la escalera de entrada, arcos y barandas
#  peligro: lo que hay al fondo de los abismos · luz-tenue: faroles colgantes
#  sangre: manchas del suelo · tesoro: bloques de la sala del tesoro y el trono
# =========================================================
general:
  distancia-min: 250            # bloques desde el campamento
  distancia-max: 450
  profundidad: 18               # bloques bajo la superficie
  salas-min: 20                 # salas POR PISO (cuadrícula de 8×7 celdas por piso)
  salas-max: 30
  # pisos: 4                    # si no se pone: 2 pisos en el acto 1 y uno más cada 2 actos (6 desde el acto 8)
                                #   (también se puede poner "pisos:" dentro de cada mazmorra)
  bloques-por-tick: 6000        # velocidad de construcción
  reaparicion-minutos: 15       # las salas vuelven a llenarse de enemigos
  enemigos-por-sala: 3          # + 1 por cada 3 tiers + 1 por jugador extra
  biomas-prohibidos: [ocean, river, frozen, ice, snowy, beach, swamp, mangrove, peaks, jagged, stony, grove, desert, badlands]

ruinas:
  activas: true
  probabilidad: 0.004           # por cada chunk nuevo (≈ 1 de cada 250)
  distancia-min-spawn: 150      # no aparecen cerca del spawn
  radio-activacion: 8


  # ================= ARMAS ESPECIALES CON PODERES (v6.2) =================
  # poderes: lista de {tipo, valor, probabilidad}. probabilidad 0.25 = 25 % de los golpes (o 25).
  # Tipos: robo_de_vida, critico, fuego, congelar, veneno, marchitar, sangrado, rayo, explosion, cadena,
  #        ejecutar, empuje, ceguera, levitar, al_matar_curar, al_matar_velocidad, espinas, esquivar

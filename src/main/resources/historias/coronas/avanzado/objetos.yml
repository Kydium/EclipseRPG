# =========================================================
#  CONJUNTOS: bonos por llevar varias piezas del mismo conjunto puestas.
#  Cada objeto dice a qué conjunto pertenece con  conjunto: <id>
#    piezas-2 / piezas-4: efectos mientras llevas 2 o 4 piezas (efecto + nivel)
#    arma: % de daño extra con un arma o herramienta del conjunto si llevas las 4 piezas
# =========================================================
conjuntos:
  fresno:
    nombre: Conjunto del Fresno
    piezas-2:
    - {efecto: speed, nivel: 1}
    piezas-4:
    - {efecto: regeneration, nivel: 1}
    arma: 10
  cobre:
    nombre: Conjunto del Gremio de Cobre
    piezas-2:
    - {efecto: haste, nivel: 1}
    piezas-4:
    - {efecto: resistance, nivel: 1}
    arma: 12
  marea:
    nombre: Conjunto de la Marea
    piezas-2:
    - {efecto: water_breathing, nivel: 1}
    piezas-4:
    - {efecto: dolphins_grace, nivel: 1}
    - {efecto: conduit_power, nivel: 1}
    arma: 12
  escarcha_eterna:

    nombre: "<aqua>Fragmento de Mejora Superior"
    lore: ["<gray>Sube armas, armaduras y herramientas", "<gray>de <white>+5</white> hasta <aqua>+8</aqua> (80 % de éxito).", "<dark_gray>Hugo junta 3 Fragmentos de Mejora en uno."]

# =========================================================
#  NPCs del Campamento del Alba
#  Créalos todos con /eclipse crearnpcs (párate en el campamento y sé OP).
#  Cada NPC de Citizens ejecuta: /eclipse npc <id> <jugador>
#  servicios: tienda:<id> | contratos | grieta
#  charla: lo que dice cuando una misión pide hablar con él
#  skin: nombre de un jugador de Minecraft cuya skin usará (opcional)
# =========================================================
npcs:
  tula:
    nombre: "<green>Abuela Tula"
    nombre-citizens: "Abuela Tula"
    charla:
      - "Ay, niño… pase lo que pase, este campamento es tu hogar."
  bruno:
    nombre: "<gold>Bruno el Herrero"
    nombre-citizens: "Bruno"
    servicios: ["tienda:herreria"]
    charla:
      - "Hmpf. Mi forja estará encendida hasta el final. Ve y gana."
  ines:
    nombre: "<red>Capitana Inés"
    nombre-citizens: "Capitana Ines"
    servicios: ["contratos", "grieta"]
    charla:
      - "Mi espada está lista. Cuando vayas, iré contigo en espíritu."
  pip:
    nombre: "<yellow>Pip el Mercader"
    nombre-citizens: "Pip"
    servicios: ["tienda:general"]
    charla:
      - "¡Si salvas el mundo, te hago descuento! Bueno… un poquito."
  lia:
    nombre: "<aqua>Lía la Exploradora"
    nombre-citizens: "Lia"
    charla:
      - "Ya mapeé el camino. Lo que haya al otro lado, lo veremos juntos."
  odon:
    nombre: "<dark_aqua>Fray Odón"
    nombre-citizens: "Fray Odon"
    servicios: ["tienda:alquimia"]
    charla:
      - "Velkar dejó su tienda abierta… y su diario encima de la mesa. Tienes que leer esto."
  velkar:
    nombre: "<dark_purple>Velkar"
    nombre-citizens: "Velkar"
    charla:
      - "…No me mires así. Pronto lo entenderás."
  errante:
    nombre: "<dark_gray>El Errante"
    nombre-citizens: "El Errante"
    servicios: ["tienda:mercado"]
    charla:
      - "El Fin no es un lugar. Es una puerta. Y tú tienes la llave."

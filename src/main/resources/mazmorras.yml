# =========================================================
#  Mazmorras de Crónicas del Eclipse (una por acto) y ruinas al azar.
#  La mazmorra de un acto se construye la primera vez que alguien acepta
#  la misión del jefe de ese acto, a cierta distancia del campamento.
#  Bloques: ids de Minecraft. botin: "spec cantidad probabilidad(0-1)"
# =========================================================
general:
  distancia-min: 250            # bloques desde el campamento
  distancia-max: 450
  profundidad: 18               # bloques bajo la superficie
  salas-min: 7
  salas-max: 10
  bloques-por-tick: 6000        # velocidad de construcción
  reaparicion-minutos: 15       # las salas vuelven a llenarse de enemigos
  enemigos-por-sala: 3          # + 1 por cada 3 tiers + 1 por jugador extra

ruinas:
  activas: true
  probabilidad: 0.004           # por cada chunk nuevo (≈ 1 de cada 250)
  distancia-min-spawn: 150      # no aparecen cerca del spawn
  radio-activacion: 8

mazmorras:
  1:
    nombre: "<green>Cripta del Bosque Podrido"
    jefe: rondador_podrido
    suelo: [mossy_stone_bricks, cobblestone, mossy_cobblestone]
    pared: [mossy_cobblestone, cobblestone, mossy_stone_bricks]
    techo: [cobblestone]
    acento: [cracked_stone_bricks, chiseled_stone_bricks]
    luz: jack_o_lantern
    decoracion: [cobweb, skeleton_skull, moss_carpet]
    botin:
      - "BREAD 6 0.8"
      - "IRON_INGOT 4 0.7"
      - "ARROW 16 0.6"
      - "GOLD_INGOT 3 0.4"
      - "pocion:healing 1 0.5"
      - "custom:pergamino_campamento 1 0.3"
      - "custom:fragmento_mejora 1 0.15"

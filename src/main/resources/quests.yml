# =========================================================
#  Historia de Crónicas del Eclipse: 110 misiones en orden.
#  Las misiones se hacen una tras otra. Cada jugador lleva su propio progreso.
#  objetivos (tipo): MATAR · MOB · TENER · ENTREGAR · FUNDIR · MINAR · PESCAR
#                    DOMESTICAR · ENCANTAR · DIMENSION · HABLAR
#  objetivo: ids de Minecraft separados por coma. '*_log' = cualquier tronco, '*' = cualquiera.
#  corrompido: true = solo cuentan los Corrompidos.
#  TENER se revisa en el inventario; ENTREGAR además quita los objetos al entregar.
#  aparecen: mobs de mobs.yml que salen al aceptar · al-aceptar: objetos que recibes
#  premios: 'material:X n', 'custom:id', 'pocion:tipo n', 'libro:encantamiento:nivel'
#  nivel: nivel RPG mínimo para aceptar · xp/soles: recompensa al entregar
# =========================================================
actos:
  1: "Acto 1 — El Despertar"
  2: "Acto 2 — Las Minas Silenciosas"
  3: "Acto 3 — Sangre en las Aldeas"
  4: "Acto 4 — Lo que Duerme en el Agua"
  5: "Acto 5 — Arena y Selva"
  6: "Acto 6 — Portal de Fuego"
  7: "Acto 7 — Las Cámaras de Prueba"
  8: "Acto 8 — La Ciudad Antigua"
  9: "Acto 9 — La Corona del Wither"
  10: "Acto 10 — El Fin del Eclipse"

misiones:
  m001:
    acto: 1
    npc: tula
    nombre: "La primera noche"
    xp: 250
    soles: 40
    dialogo:
      - "¡Por fin despiertas! Te encontramos tirado junto al camino."
      - "Mira el cielo… el sol no salió del todo. Lo llaman el Eclipse."
      - "Antes de que caiga la noche necesitamos madera. Tala 16 troncos y hazte una mesa de trabajo."
    final:
      - "Bien hecho. Con eso levantaremos el Campamento del Alba."
    objetivos:
      - {tipo: MINAR, objetivo: "*_log,*_stem", cantidad: 16, texto: "Tala 16 troncos"}
      - {tipo: TENER, objetivo: "crafting_table", cantidad: 1, texto: "Ten una mesa de trabajo"}
    premios: ["BREAD 10"]

  m002:
    acto: 1
    npc: tula
    nombre: "Un techo"
    xp: 250
    soles: 40
    dialogo:
      - "De noche salen cosas que no deberían existir."
      - "Hazte una cama y unas antorchas. La luz los mantiene lejos… casi siempre."
    final:
      - "Así me gusta. Duerme con un ojo abierto."
    objetivos:
      - {tipo: TENER, objetivo: "*_bed", cantidad: 1, texto: "Ten una cama"}
      - {tipo: TENER, objetivo: "torch", cantidad: 8, texto: "Ten 8 antorchas"}

  m003:
    acto: 1
    npc: bruno
    nombre: "Herramientas de piedra"
    xp: 250
    soles: 40
    dialogo:
      - "Soy Bruno. Herrero. No hablo mucho."
      - "Con las manos no vas a durar. Pico, hacha y espada de piedra. Ya."
    final:
      - "Hmpf. No están mal. Toma carbón para la forja."
    objetivos:
      - {tipo: TENER, objetivo: "stone_pickaxe", cantidad: 1, texto: "Ten un pico de piedra"}
      - {tipo: TENER, objetivo: "stone_axe", cantidad: 1, texto: "Ten un hacha de piedra"}
      - {tipo: TENER, objetivo: "stone_sword", cantidad: 1, texto: "Ten una espada de piedra"}
    premios: ["COAL 16"]

  m004:
    acto: 1
    npc: tula
    nombre: "Comida para todos"
    xp: 250
    soles: 40
    dialogo:
      - "Somos pocos, pero comemos como muchos."
      - "Caza unos animales para el campamento, ¿sí?"
    final:
      - "¡Esta noche hay guiso! Toma, unas manzanas para el camino."
    objetivos:
      - {tipo: MATAR, objetivo: "cow,pig,sheep,chicken,rabbit", cantidad: 6, texto: "Caza 6 animales"}
    premios: ["APPLE 3"]

  m005:
    acto: 1
    npc: ines
    nombre: "Los primeros Corrompidos"
    xp: 250
    soles: 40
    dialogo:
      - "Capitana Inés, guardia del campamento."
      - "¿Ves esos zombis con ojos morados? Son Corrompidos: el Eclipse los hace más fuertes."
      - "Ahí vienen unos. Demuéstrame que sabes pelear."
    final:
      - "Nada mal, recluta. Toma este escudo, lo vas a necesitar."
    objetivos:
      - {tipo: MATAR, objetivo: "zombie,husk,drowned,zombie_villager", cantidad: 5, texto: "Mata 5 Zombis Corrompidos", corrompido: true}
    aparecen: ["zombi_corrompido:3"]
    premios: ["SHIELD 1"]

  m006:
    acto: 1
    npc: bruno
    nombre: "Hierro para la forja"
    xp: 250
    soles: 40
    dialogo:
      - "La piedra no aguanta a un Corrompido."
      - "Baja a las cuevas, saca hierro y fúndelo. Doce lingotes."
    final:
      - "Buen hierro. Ahora sí podemos trabajar."
    objetivos:
      - {tipo: FUNDIR, objetivo: "iron_ingot", cantidad: 12, texto: "Funde 12 lingotes de hierro"}

  m007:
    acto: 1
    npc: bruno
    nombre: "Armadura de hierro"
    xp: 250
    soles: 40
    dialogo:
      - "Un guerrero sin armadura es un guerrero muerto."
      - "Hazte el set completo de hierro."
    final:
      - "Ahora pareces alguien. Toma, oro para lo que venga."
    objetivos:
      - {tipo: TENER, objetivo: "iron_helmet", cantidad: 1, texto: "Casco de hierro"}
      - {tipo: TENER, objetivo: "iron_chestplate", cantidad: 1, texto: "Pechera de hierro"}
      - {tipo: TENER, objetivo: "iron_leggings", cantidad: 1, texto: "Pantalones de hierro"}
      - {tipo: TENER, objetivo: "iron_boots", cantidad: 1, texto: "Botas de hierro"}
    premios: ["GOLD_INGOT 5"]

  m008:
    acto: 1
    npc: ines
    nombre: "Telarañas"
    xp: 250
    soles: 40
    dialogo:
      - "Las arañas del bosque también se corrompieron."
      - "Limpia la zona y tráeme hilo para hacer cuerdas de arco."
    final:
      - "Con esto armamos arcos para todos. Uno es tuyo."
    objetivos:
      - {tipo: MATAR, objetivo: "spider,cave_spider", cantidad: 6, texto: "Mata 6 Arañas Corrompidas", corrompido: true}
      - {tipo: ENTREGAR, objetivo: "string", cantidad: 8, texto: "Entrega 8 hilos"}
    aparecen: ["arana_corrompida:4"]
    premios: ["BOW 1"]

  m009:
    acto: 1
    npc: tula
    nombre: "El estanque"
    xp: 250
    soles: 40
    dialogo:
      - "Cuando era joven pescaba en el estanque al amanecer…"
      - "Tráeme algo de pescado, me trae buenos recuerdos."
    final:
      - "Gracias, niño. Toma estas pociones, las preparé yo misma."
    objetivos:
      - {tipo: PESCAR, cantidad: 5, texto: "Pesca 5 veces"}
    premios: ["pocion:healing 3"]

  m010:
    acto: 1
    npc: ines
    nombre: "La noche más larga"
    xp: 250
    soles: 40
    dialogo:
      - "Algo grande se mueve cerca del campamento. Los monstruos están nerviosos."
      - "Mata todo lo que se acerque esta noche."
    final:
      - "Lo sentí… es el Rondador Podrido. Toma este Fragmento de Mejora y llévaselo a Bruno."
    objetivos:
      - {tipo: MATAR, objetivo: "*", cantidad: 15, texto: "Mata 15 monstruos"}
    premios: ["custom:fragmento_mejora"]

  m011:
    acto: 1
    npc: ines
    nombre: "JEFE: Rondador Podrido"
    jefe: true
    nivel: 5
    xp: 0
    soles: 0
    dialogo:
      - "El Rondador Podrido guarda el primer Fragmento Solar."
      - "Toma este sello. Rómpelo donde quieras pelear y él aparecerá."
      - "Lleva amigos si puedes. No es un zombi cualquiera."
    final:
      - "¡Lo lograste! El primer Fragmento Solar… la Abuela Tula tiene que ver esto."
    objetivos:
      - {tipo: MOB, objetivo: "rondador_podrido", cantidad: 1, texto: "Derrota al Rondador Podrido"}
    al-aceptar: ["custom:sello_rondador"]

  m012:
    acto: 2
    npc: pip
    nombre: "El mercader perdido"
    xp: 500
    soles: 80
    dialogo:
      - "¡Uf! ¡Gente! Soy Pip, mercader… o lo era, hasta que algo me sacó de las minas."
      - "¿Me prestas algo de carbón? Perdí todo mi cargamento."
    final:
      - "¡Eres un sol! Aquí tienes, esmeraldas. Desde hoy tengo tienda aquí."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "coal", cantidad: 10, texto: "Entrega 10 carbones"}
    premios: ["EMERALD 3"]

  m013:
    acto: 2
    npc: bruno
    nombre: "Hacia lo profundo"
    xp: 500
    soles: 80
    dialogo:
      - "Pip dice que los mineros desaparecen en lo profundo."
      - "Baja hasta la pizarra profunda. Quiero saber qué hay allá abajo."
    final:
      - "Pizarra profunda… y huellas de hueso. Esto no me gusta."
    objetivos:
      - {tipo: MINAR, objetivo: "deepslate,cobbled_deepslate", cantidad: 32, texto: "Mina 32 de pizarra profunda"}

  m014:
    acto: 2
    npc: pip
    nombre: "Oro para Pip"
    xp: 500
    soles: 80
    dialogo:
      - "Un mercader sin oro es un mercader triste."
      - "¿Me consigues unos lingotes? Te pago bien, palabra de Pip."
    final:
      - "¡Brillante! Literalmente."
    objetivos:
      - {tipo: FUNDIR, objetivo: "gold_ingot", cantidad: 8, texto: "Funde 8 lingotes de oro"}
    premios: ["EMERALD 5"]

  m015:
    acto: 2
    npc: ines
    nombre: "Huesos que caminan"
    xp: 500
    soles: 80
    dialogo:
      - "Los esqueletos de las minas suben a la superficie."
      - "Ahí vienen. ¡Cúbrete de las flechas!"
    final:
      - "Buen trabajo. Toma flechas, te gastaste las tuyas."
    objetivos:
      - {tipo: MATAR, objetivo: "skeleton,stray,bogged", cantidad: 8, texto: "Mata 8 Esqueletos Corrompidos", corrompido: true}
    aparecen: ["esqueleto_corrompido:5"]
    premios: ["ARROW 32"]

  m016:
    acto: 2
    npc: ines
    nombre: "Creepers silenciosos"
    xp: 500
    soles: 80
    dialogo:
      - "Estos creepers no hacen ruido… y corren."
      - "Mátalos antes de que exploten y tráeme su pólvora."
    final:
      - "La pólvora servirá para las defensas. Toma, un Fragmento."
    objetivos:
      - {tipo: MATAR, objetivo: "creeper", cantidad: 5, texto: "Mata 5 Creepers Corrompidos", corrompido: true}
      - {tipo: ENTREGAR, objetivo: "gunpowder", cantidad: 10, texto: "Entrega 10 de pólvora"}
    aparecen: ["creeper_corrompido:3"]
    premios: ["custom:fragmento_mejora"]

  m017:
    acto: 2
    npc: bruno
    nombre: "Brillo azul"
    xp: 500
    soles: 80
    dialogo:
      - "Para encantar armas necesitamos lapislázuli."
      - "Búscalo en las cuevas."
    final:
      - "Toma, una mesa de encantamientos. Fray Odón te enseñará luego."
    objetivos:
      - {tipo: MINAR, objetivo: "lapis_ore,deepslate_lapis_ore", cantidad: 8, texto: "Mina 8 menas de lapislázuli"}
    premios: ["ENCHANTING_TABLE 1"]

  m018:
    acto: 2
    npc: bruno
    nombre: "Venas rojas"
    xp: 500
    soles: 80
    dialogo:
      - "La redstone brilla como sangre en la roca."
      - "Tráeme lo que encuentres."
    final:
      - "Bien. Esto alimentará mis máquinas."
    objetivos:
      - {tipo: MINAR, objetivo: "redstone_ore,deepslate_redstone_ore", cantidad: 12, texto: "Mina 12 menas de redstone"}

  m019:
    acto: 2
    npc: bruno
    nombre: "El tesoro de las minas"
    xp: 500
    soles: 80
    dialogo:
      - "Los mineros buscaban diamantes cuando desaparecieron."
      - "Encuentra cinco. Quédatelos, solo quiero verlos."
    final:
      - "Diamantes de verdad… Ahora entiendo por qué bajaron tanto."
    objetivos:
      - {tipo: TENER, objetivo: "diamond", cantidad: 5, texto: "Ten 5 diamantes"}
    premios: ["EMERALD 10"]

  m020:
    acto: 2
    npc: pip
    nombre: "Túneles abandonados"
    xp: 500
    soles: 80
    dialogo:
      - "Mi carreta quedó en una mina abandonada."
      - "Tráeme los rieles de allí, valen oro."
    final:
      - "¡Mis rieles! Toma este pico de diamante, era de un minero perdido."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "rail", cantidad: 16, texto: "Entrega 16 rieles"}
    premios: ["DIAMOND_PICKAXE 1"]

  m021:
    acto: 2
    npc: pip
    nombre: "Cristales"
    xp: 500
    soles: 80
    dialogo:
      - "Dicen que en las geodas hay cristales morados que cantan."
      - "Tráeme unos, por favor."
    final:
      - "Preciosos. Toma este catalejo."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "amethyst_shard", cantidad: 8, texto: "Entrega 8 fragmentos de amatista"}
    premios: ["SPYGLASS 1"]

  m022:
    acto: 2
    npc: ines
    nombre: "JEFE: Capataz Hueso"
    jefe: true
    nivel: 10
    xp: 0
    soles: 0
    dialogo:
      - "El Capataz Hueso manda a los esqueletos de las minas. Él se llevó a los mineros."
      - "Rompe este sello en lo profundo y termina con él."
    final:
      - "El segundo Fragmento Solar. Los mineros pueden descansar en paz."
    objetivos:
      - {tipo: MOB, objetivo: "capataz_hueso", cantidad: 1, texto: "Derrota al Capataz Hueso"}
    al-aceptar: ["custom:sello_capataz"]

  m023:
    acto: 3
    npc: lia
    nombre: "La exploradora"
    xp: 750
    soles: 120
    dialogo:
      - "¡Hola! Soy Lía, exploradora. Vengo de las aldeas del este."
      - "Los saqueadores las están atacando… y llevan la marca del Eclipse."
      - "Hazme un mapa para marcar las aldeas."
    final:
      - "Perfecto. Toma esta brújula."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "map,filled_map", cantidad: 1, texto: "Entrega un mapa"}
    premios: ["COMPASS 1"]

  m024:
    acto: 3
    npc: lia
    nombre: "Comercio con la aldea"
    xp: 750
    soles: 120
    dialogo:
      - "Los aldeanos confían en quien comercia con ellos."
      - "Consigue esmeraldas: comercia, vende o explora."
    final:
      - "Ya te conocen en la aldea. Eso nos ayudará."
    objetivos:
      - {tipo: TENER, objetivo: "emerald", cantidad: 10, texto: "Ten 10 esmeraldas"}

  m025:
    acto: 3
    npc: tula
    nombre: "Cosecha"
    xp: 750
    soles: 120
    dialogo:
      - "Llegan refugiados de las aldeas. Hay que alimentarlos."
      - "Siembra y cosecha, niño."
    final:
      - "Gracias. Toma, pociones de regeneración."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "wheat", cantidad: 32, texto: "Entrega 32 de trigo"}
      - {tipo: ENTREGAR, objetivo: "carrot", cantidad: 16, texto: "Entrega 16 zanahorias"}
    premios: ["pocion:regeneration 3"]

  m026:
    acto: 3
    npc: tula
    nombre: "Pan para los refugiados"
    xp: 750
    soles: 120
    dialogo:
      - "Con el trigo ya podemos hacer pan."
      - "Veinte panes alcanzarán para todos."
    final:
      - "Mira sus caras… les devolviste la esperanza."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "bread", cantidad: 20, texto: "Entrega 20 panes"}
    premios: ["custom:fragmento_mejora"]

  m027:
    acto: 3
    npc: ines
    nombre: "Patrulla saqueadora"
    xp: 750
    soles: 120
    dialogo:
      - "Una patrulla de saqueadores viene hacia acá."
      - "Que no lleguen al campamento."
    final:
      - "Bien hecho. Quédate con una de sus ballestas."
    objetivos:
      - {tipo: MATAR, objetivo: "pillager", cantidad: 6, texto: "Mata 6 Saqueadores Corrompidos", corrompido: true}
    aparecen: ["saqueador_corrompido:3"]
    premios: ["CROSSBOW 1"]

  m028:
    acto: 3
    npc: ines
    nombre: "Hachas en la noche"
    xp: 750
    soles: 120
    dialogo:
      - "Los vindicadores son peores. Usan hachas y no tienen miedo."
      - "Cuídate la cabeza."
    final:
      - "Toma este casco de diamante. Te lo ganaste."
    objetivos:
      - {tipo: MATAR, objetivo: "vindicator", cantidad: 4, texto: "Mata 4 Vindicadores Corrompidos", corrompido: true}
    aparecen: ["vindicador_corrompido:3"]
    premios: ["DIAMOND_HELMET 1"]

  m029:
    acto: 3
    npc: ines
    nombre: "Cazar a la patrulla"
    xp: 750
    soles: 120
    dialogo:
      - "Los illagers se están organizando. Alguien los dirige."
      - "Busca sus patrullas y su mansión. Mata a todos los que puedas."
    final:
      - "Hablan de un 'Heraldo'… Toma estas manzanas doradas."
    objetivos:
      - {tipo: MATAR, objetivo: "pillager,vindicator,evoker,ravager,vex", cantidad: 10, texto: "Mata 10 illagers"}
    premios: ["GOLDEN_APPLE 3"]

  m030:
    acto: 3
    npc: bruno
    nombre: "Preparar la defensa"
    xp: 750
    soles: 120
    dialogo:
      - "Si vienen, que nos encuentren listos."
      - "Escudo y muchas flechas."
    final:
      - "Hmpf. Ahora sí."
    objetivos:
      - {tipo: TENER, objetivo: "shield", cantidad: 1, texto: "Ten un escudo"}
      - {tipo: TENER, objetivo: "arrow", cantidad: 64, texto: "Ten 64 flechas"}

  m031:
    acto: 3
    npc: lia
    nombre: "Un guardián de hierro"
    xp: 750
    soles: 120
    dialogo:
      - "Las aldeas tienen golems de hierro que las protegen."
      - "Tráeme los materiales y armaremos uno para el campamento."
    final:
      - "¡Ya tenemos guardián! Y para ti, una pechera de diamante."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "iron_block", cantidad: 4, texto: "Entrega 4 bloques de hierro"}
      - {tipo: ENTREGAR, objetivo: "carved_pumpkin", cantidad: 1, texto: "Entrega una calabaza tallada"}
    premios: ["DIAMOND_CHESTPLATE 1"]

  m032:
    acto: 3
    npc: lia
    nombre: "La mansión del bosque"
    xp: 750
    soles: 120
    dialogo:
      - "Los evocadores guardan tótems que engañan a la muerte."
      - "Encuentra uno. Ya sea en una mansión o en una invasión."
    final:
      - "Con esto el Heraldo no podrá esconderse."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "totem_of_undying", cantidad: 1, texto: "Entrega un tótem de inmortalidad"}
    premios: ["custom:fragmento_mejora"]

  m033:
    acto: 3
    npc: ines
    nombre: "JEFE: Heraldo de la Mancha"
    jefe: true
    nivel: 15
    xp: 0
    soles: 0
    dialogo:
      - "El Heraldo de la Mancha es quien manda a los illagers."
      - "Rompe el sello y acaba con él. Desaparece y aparece donde menos lo esperas."
    final:
      - "¡El tercer Fragmento! Las aldeas vuelven a estar a salvo."
    objetivos:
      - {tipo: MOB, objetivo: "heraldo_mancha", cantidad: 1, texto: "Derrota al Heraldo de la Mancha"}
    al-aceptar: ["custom:sello_heraldo"]

  m034:
    acto: 4
    npc: odon
    nombre: "El monje náufrago"
    xp: 1000
    soles: 160
    dialogo:
      - "Soy Fray Odón… estudioso. Mi barco se hundió y llegué a esta orilla."
      - "Bajo el agua vi una corona que brillaba. Necesito libros para escribirlo todo."
    final:
      - "Gracias. Toma este libro encantado, lo encontré en el naufragio."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "book", cantidad: 3, texto: "Entrega 3 libros"}
    premios: ["libro:protection:3"]

  m035:
    acto: 4
    npc: odon
    nombre: "Tinta para el diario"
    xp: 1000
    soles: 160
    dialogo:
      - "Sin tinta no hay historia."
      - "Los calamares tienen la que necesito."
    final:
      - "Ahora puedo escribir lo que vi bajo el mar."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "ink_sac", cantidad: 10, texto: "Entrega 10 sacos de tinta"}
      - {tipo: ENTREGAR, objetivo: "writable_book", cantidad: 1, texto: "Entrega un libro y pluma"}

  m036:
    acto: 4
    npc: lia
    nombre: "Navegante"
    xp: 1000
    soles: 160
    dialogo:
      - "Para llegar a esa corona hay que cruzar el océano."
      - "Hazte un bote."
    final:
      - "Toma comida para el viaje. El mar es largo."
    objetivos:
      - {tipo: TENER, objetivo: "*_boat,*_raft", cantidad: 1, texto: "Ten un bote"}
    premios: ["COOKED_COD 16"]

  m037:
    acto: 4
    npc: lia
    nombre: "Tesoro enterrado"
    xp: 1000
    soles: 160
    dialogo:
      - "Los naufragios esconden mapas del tesoro."
      - "Encuentra un corazón del mar. Dicen que late cerca de la corona."
    final:
      - "Late… de verdad late. Toma, esmeraldas."
    objetivos:
      - {tipo: ENTREGAR, objetivo: "heart_of_the_sea", cantidad: 1, texto: "Entrega un corazón del mar"}
    premios: ["EMERALD 10"]

  m038:
    acto: 4
    npc: ines
    nombre: "La marea muerta"
    xp: 1000
    soles: 160
    dialogo:
      - "Los ahogados salen del agua por las noches."
      - "Acaba con ellos antes de que lleguen a la playa."
    final:

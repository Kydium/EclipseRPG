name: Compilar EclipseRPG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Paquete de recursos (skins de NPCs)
        run: |
          cd resourcepack
          find . -exec touch -t 202601010000 {} +
          zip -X -r -9 ../EclipseRPG-pack.zip pack.mcmeta assets
          cd ..
          SHA=$(sha1sum EclipseRPG-pack.zip | cut -d' ' -f1)
          echo "url=https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/EclipseRPG-pack.zip" > src/main/resources/pack.properties
          echo "sha1=$SHA" >> src/main/resources/pack.properties
          cat src/main/resources/pack.properties

      - name: Compilar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EclipseRPG
          path: build/libs/*.jar

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EclipseRPG build ${{ github.run_number }}
          files: |
            build/libs/*.jar
            EclipseRPG-pack.zip
          make_latest: true

name: Compilar Aventura Maker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Paquete de recursos (skins de NPCs)
        run: |
          mkdir -p pack/assets/eclipse/textures/npc
          cp src/main/resources/motor/pack.mcmeta pack/
          cp src/main/resources/skins/*.png pack/assets/eclipse/textures/npc/
          mkdir -p pack/assets/minecraft/textures/entity
          (cd src/main/resources/motor/corrupcion && find . -name '*.png' -exec cp --parents {} ../../../../../pack/assets/minecraft/textures/entity/ \;)
          mkdir -p pack/assets/eclipse/font pack/assets/eclipse/textures/hud
          cp src/main/resources/motor/hud/hud.json pack/assets/eclipse/font/hud.json
          cp src/main/resources/motor/hud/coin.png pack/assets/eclipse/textures/hud/coin.png
          cd pack
          find . -exec touch -t 202601010000 {} +
          zip -X -r -9 ../EclipseRPG-pack.zip pack.mcmeta assets
          cd ..
          SHA=$(sha1sum EclipseRPG-pack.zip | cut -d' ' -f1)
          echo "url=https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/EclipseRPG-pack.zip" > src/main/resources/pack.properties
          echo "sha1=$SHA" >> src/main/resources/pack.properties
          cat src/main/resources/pack.properties

      - name: Compilar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AventuraMaker
          path: build/libs/*.jar

      - name: Prueba en un servidor real (aldea, NPCs, ruina, mazmorra)
        run: |
          mkdir -p srv/plugins
          URL=$(curl -s -A "EclipseRPG-CI" https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/latest | jq -r '.downloads["server:default"].url')
          echo "Paper: $URL"
          curl -sL -A "EclipseRPG-CI" -o srv/paper.jar "$URL"
          cp build/libs/*.jar srv/plugins/
          cd srv
          echo "eula=true" > eula.txt
          printf "online-mode=false\nspawn-protection=0\nview-distance=6\nsimulation-distance=6\nlevel-seed=20261116\n" > server.properties
          timeout 1200 java -Xmx6G -Declipse.prueba=true -jar paper.jar --nogui < /dev/null > ../prueba.log 2>&1 || true
          cd ..
          grep -E "\[PRUEBA\]|AventuraMaker.*(WARN|ERROR|Exception)|Bloque desconocido|no reconocidos" prueba.log || true
          grep -q "RESULTADO: TODO BIEN" prueba.log

      - name: Guardar registro de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-log
          path: prueba.log

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aventura Maker build ${{ github.run_number }}
          files: |
            build/libs/*.jar
            EclipseRPG-pack.zip
          make_latest: true
